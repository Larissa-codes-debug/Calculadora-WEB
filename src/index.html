<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Calculadora de IMC</h1>

            <p>
                Informe seu peso e sua altura
                para calcular seu IMC.
            </p>

            <div class="campo">

                <label for="peso">
                    Peso (kg)
                </label>

                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 70"
                    step="0.1"
                >

            </div>


            <div class="campo">

                <label for="altura">
                    Altura (m)
                </label>

                <input
                    type="number"
                    id="altura"
                    placeholder="Ex: 1.75"
                    step="0.01"
                >

            </div>


            <button onclick="calcularIMC()">
                Calcular IMC
            </button>


            <div
                id="resultado"
                class="resultado"
            ></div>

        </section>

    </main>


    <script src="/script.js"></script>

</body>

</html>
