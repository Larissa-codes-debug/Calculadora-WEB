<<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadoras</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Calculadoras</h1>

            <p class="subtitulo">
                Escolha uma calculadora para começar
            </p>

            <!-- Menu de escolha -->
            <div class="menu">

                <button
                    class="botao-menu ativo"
                    onclick="mostrarCalculadora('imc')"
                >
                    Calculadora de IMC
                </button>

                <button
                    class="botao-menu"
                    onclick="mostrarCalculadora('bissexto')"
                >
                    Ano Bissexto
                </button>

            </div>


            <!-- =========================
                 CALCULADORA DE IMC
            ========================== -->

            <div id="calculadora-imc" class="calculadora">

                <h2>Calculadora de IMC</h2>

                <p>
                    Informe seu peso e sua altura para calcular seu IMC.
                </p>

                <div class="campo">

                    <label for="peso">
                        Peso (kg)
                    </label>

                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 70"
                        step="0.1"
                    >

                </div>


                <div class="campo">

                    <label for="altura">
                        Altura (m)
                    </label>

                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        step="0.01"
                    >

                </div>


                <button
                    class="botao-calcular"
                    onclick="calcularIMC()"
                >
                    Calcular IMC
                </button>


                <div
                    id="resultado-imc"
                    class="resultado"
                ></div>

            </div>


            <!-- =========================
                 CALCULADORA DE ANO BISSEXTO
            ========================== -->

            <div
                id="calculadora-bissexto"
                class="calculadora escondida"
            >

                <h2>Verificador de Ano Bissexto</h2>

                <p>
                    Digite um ano para descobrir se ele é bissexto
                    e qual será o próximo ano bissexto.
                </p>


                <div class="campo">

                    <label for="ano">
                        Ano
                    </label>

                    <input
                        type="number"
                        id="ano"
                        placeholder="Ex: 2026"
                        step="1"
                    >

                </div>


                <button
                    class="botao-calcular"
                    onclick="verificarBissexto()"
                >
                    Verificar Ano
                </button>


                <div
                    id="resultado-bissexto"
                    class="resultado"
                ></div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
